name: k3-capacity-hack
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 src/runner.py
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: dashboard/*.json
